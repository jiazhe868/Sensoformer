# configs/training/finetune.yaml

type: finetune

epochs: 150
patience: 50
val_size: 0.15
test_size: 0.15

# Optimization (Differential Learning Rates)
lr_backbone: 2e-6   # Slow updates for feature extractor
lr_head: 2e-6       # Faster updates for regression heads
weight_decay: 1e-4

# Loss Function (Physics-Informed / Robust)
loss: focal
focal_gamma: 1.5    # Focus on hard examples

# Transfer Learning
# Point this to the output of the pretrain run or a fixed path
pretrained_ckpt: "./best_sensoformer_pretrain.pth"
ckpt_name: "best_finetuned_model.pth"

# Evaluation & Smoke Test Control
eval_test: true
smoke_test: false

# Label-efficiency experiments: fraction of the training split to use (1.0 = all)
train_fraction: 1.0

# Optional scale-invariant orientation loss on the deviatoric moment tensor
# (smooth Kagan-angle surrogate, OrientationCosineLoss). 0.0 = disabled.
orientation_loss_weight: 0.0
